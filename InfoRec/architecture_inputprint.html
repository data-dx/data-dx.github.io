<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>輸入區域｜InfoRec</title>
  <link rel="stylesheet" href="../css/site.css">
  <script src="../js/redirect.js"></script>
</head>

<body class="ir-content-body">
  <main class="ir-page ir-doc">
    <h1>輸入區域</h1>
    <hr />
    <!-- 主視窗右邊的輸入區域；按鈕名稱照 InfoRec 繁中語言檔 [FormInfoRec]（列印、列印預覽、份數、縮放），位置照 FrmInfoRec.dfm 的 PanPrint、ScrollBox1 -->
    <p>
      輸入區域位於主視窗右邊，顯示目前文件的畫面。資料直接填在文件上對應的位置，所見即所印，填好即可預覽或列印。
    </p>

    <ol>
      <li>於工作頁選好文件及資料擁有者，這裡即顯示該文件。</li>
      <li>依序填入各欄資料；有代號的欄位可輸入代號或關鍵字，帶入客戶、項目等資料。</li>
      <li>按上方「列印」；勾選「列印預覽」時，會先顯示預覽畫面。</li>
    </ol>
    <p class="ir-note">
      備註：
    </p>
    <ol>
      <li>「份數」可設定列印張數；標籤類文件可指定起始格或印滿本頁。</li>
      <li>螢幕解析度較低時，可拖拉與工作頁之間的分隔線，或調整「縮放」，讓文件完整顯示，方便輸入。</li>
      <li>列印後的資料會存入工作頁的「<a href="Architecture_sheet.html">列印記錄</a>」。</li>
    </ol>

    <figure>
      <img class="winimg" src="images/Architecture_IO.png" alt="輸入區域">
      <figcaption class="TACenter">輸入區域</figcaption>
    </figure>
  </main>

  <script>
    (function () {
      function postHeight() {
        try {
          var h = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          );
          parent.postMessage({ type: 'inforec-iframe-height', height: h }, '*');
        } catch (e) {}
      }
      window.addEventListener('load', postHeight);
      window.addEventListener('resize', postHeight);
      setTimeout(postHeight, 300);
      setTimeout(postHeight, 900);
    })();
  </script>
</body>
</html>
