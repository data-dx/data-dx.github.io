<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>隱私權政策｜InfoRec</title>
  <link rel="stylesheet" href="css/site.css">
  <script src="js/redirect.js"></script>
</head>

<body class="ir-content-body">
  <main class="ir-page ir-doc">
    <h1>隱私權政策</h1>
    <hr />
    <!-- 小標題＋段落（段落首行縮排兩字；ir-doc 讓標題貼近內容，規則在 css/site.css） -->
    <h2>資料儲存</h2>
    <p>
      InfoRec 的資料與紀錄僅存於使用者的電腦中。
    </p>

    <h2>註冊資料</h2>
    <p>
      申請註冊須填寫註冊名稱、聯絡人、電子信箱、電話及地址，並傳送裝置識別碼與已列印張數，以確認是否符合註冊條件。上述資料僅用於辦理註冊及通知軟體相關事項，不提供給第三方。
    </p>
    <p>
      透過 IRVault 線上註冊者，適用 <a href="https://inforec-auth.web.app/privacy.html#zh-TW" target="_blank" rel="noopener">IRVault 隱私權政策</a>。
    </p>

    <h2>文件設定檔下載統計</h2>
    <p>
      下載網站的文件設定檔時，會記錄該文件下載次數，供了解文件使用情形及回饋文件設計者使用。
    </p>

    <h2>網站流量統計</h2>
    <p>
      本網站使用 Google Analytics 統計瀏覽情形。
    </p>
  </main>

  <script>
    /* 高度自動通知 (VMware/iframe 環境適用) */
    (function () {
      function postHeight() {
        try {
          var h = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          );
          parent.postMessage({ type: 'inforec-iframe-height', height: h }, '*');
        } catch (e) {}
      }
      window.addEventListener('load', postHeight);
      window.addEventListener('resize', postHeight);
      setTimeout(postHeight, 300);
      setTimeout(postHeight, 900);
    })();
  </script>
</body>
</html>
