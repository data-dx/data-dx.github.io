<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>軟體下載｜InfoRec</title>
    <link rel="stylesheet" href="css/site.css" />
    <script src="js/redirect.js"></script>
    <style>
      /* 說明頁沒有載入 Bootstrap，下載區塊樣式寫在這裡 */
      .dl-box { padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.25rem; }
      .dl-btn {
        display: inline-block; padding: .6rem 1.4rem; border-radius: 8px;
        background: #198754; color: #fff !important; font-weight: 700; text-decoration: none !important;
      }
      .dl-btn:hover { background: #157347; }
      .dl-ver { font-size: .95rem; color: #9aa3af; }
      .dl-list { display: grid; grid-template-columns: max-content 1fr; gap: .6rem 0; margin: 0 0 1rem 2em; }
      .dl-list { line-height: 1.75; }
      .dl-list dt, .dl-list dt a { font-weight: 700; margin: 0; }
      .dl-list dd { margin: 0; }
      @media (max-width: 575px) {
        .dl-list { grid-template-columns: 1fr; gap: 0; margin-left: 0; }
        .dl-list dd { margin-bottom: .6rem; }
      }
    </style>
  </head>

  <body class="ir-page">
    <h1>軟體下載</h1>
    <hr />

    <p>
      本軟體用於 Windows 作業系統，免安裝，下載後解壓縮即可使用。
    </p>

    <div class="ir-card dl-box">
      <a href="download/InfoRec.7z" class="dl-btn">下載</a>
      <!-- 版本日期自動讀 update/Version.txt（第一行民國年，例如 1151120 → 2026/11/20），更新程式時不用改本頁 -->
      <span class="dl-ver">
        <span id="verLine" hidden>版本 <span id="verDate"></span></span>
      </span>
    </div>

    <!-- 標題＋說明兩欄排列：說明換行時對齊說明開頭（懸掛縮排），各列間距緊湊 -->
    <dl class="dl-list">
      <dt><a href="use/quick-start.html">使用入門</a>：</dt>
      <dd>從下載到印出第一張文件的操作步驟。</dd>

      <!-- 註冊後保留的功能依註冊主文件 §2「功能開放對照」：試用到期＝社群版，匯入套印反灰、網路下載設定檔關閉 -->
      <dt><a href="registration.html">軟體註冊</a>：</dt>
      <dd>下載後可完整試用 3 個月；試用期間實際列印滿 10 張以上即可免費註冊，註冊後可繼續使用匯入套印、網路下載文件設定檔、軟體更新等進階功能。</dd>
    </dl>
    <script>
      (function () {
        fetch("update/Version.txt", { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .then(function (t) {
            var m = /^\s*(\d{3})(\d{2})(\d{2})/.exec(t);
            if (!m) return;
            document.getElementById("verDate").textContent = (+m[1] + 1911) + "/" + m[2] + "/" + m[3];
            document.getElementById("verLine").hidden = false;
          })
          .catch(function () {});
      })();
    </script>

    <script>
      /* 高度自動通知（在 /InfoRec/ 外框內顯示時用） */
      (function () {
        function postHeight() {
          try {
            var h = Math.max(
              document.body.scrollHeight,
              document.documentElement.scrollHeight,
            );
            parent.postMessage({ type: "inforec-iframe-height", height: h }, "*");
          } catch (e) {}
        }
        window.addEventListener("load", postHeight);
        window.addEventListener("resize", postHeight);
        setTimeout(postHeight, 300);
        setTimeout(postHeight, 900);
      })();
    </script>
  </body>
</html>
